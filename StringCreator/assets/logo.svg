<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="StringCreator logo">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00e676"/>
      <stop offset="1" stop-color="#00e5ff"/>
    </linearGradient>
    <linearGradient id="panel" x1="64" y1="8" x2="64" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#101826"/>
      <stop offset="1" stop-color="#0a0e14"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- terminal panel -->
  <rect x="10" y="16" width="108" height="96" rx="18" fill="url(#panel)" stroke="url(#neon)" stroke-width="3"/>
  <!-- top bar dots -->
  <circle cx="27" cy="33" r="3.4" fill="#00e676"/>
  <circle cx="39" cy="33" r="3.4" fill="#00e5ff" opacity="0.85"/>
  <circle cx="51" cy="33" r="3.4" fill="#39ff14" opacity="0.7"/>
  <line x1="10" y1="46" x2="118" y2="46" stroke="url(#neon)" stroke-width="1.4" opacity="0.35"/>

  <g filter="url(#glow)" stroke="url(#neon)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- prompt caret >_ -->
    <polyline points="30,64 44,76 30,88"/>
    <line x1="54" y1="90" x2="72" y2="90"/>
    <!-- closing brace } to hint 'string/code' -->
    <path d="M86 60 q10 0 10 10 q0 6 6 6 q-6 0 -6 6 q0 10 -10 10" stroke="#00e5ff"/>
  </g>
</svg>
